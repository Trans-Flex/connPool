name: Go Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25' # 请根据你实际的 go.mod 版本修改

    - name: Build
      run: go build -v ./...

    - name: Test with Race Detector
      run: go test -race -v ./...